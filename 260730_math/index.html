<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Casino para dummies</title>
</head>

<body>
    <header>
        <h1>Casino para dummies</h1>
        <p>Datos, números secretos, números aleatorios...cosas matemáticas</p>
    </header>
    <main class="contenedor">
        <section class="estacion">
            <div class="numEstacion">01</div>
            <h2>Redondeo</h2>
            <p>Escribe un número decimal y observa qué resultado produce cada método</p>
            <div class="zona-controles">
                <label for="numeroDecimal">
                    Escribe un número decimal
                </label>
                <input type="number" id="numeroDecimal" value="4.6">
                <button id="btnProbarRedondeo">Probar redondeos</button>
            </div>
            <div class="resultadosRedondeos">
                <article>
                    <span>Math.round()</span>
                    <p id="resultadoRound">?</p>
                    <small>Al entero más próximo</small>
                </article>

                <article>
                    <span>Math.ceil()</span>
                    <p id="resultadoCeil">?</p>
                    <small>Redondear hacia arriba</small>
                </article>

                <article>
                    <span>Math.floor()</span>
                    <p id="resultadoFloor">?</p>
                    <small>Redondear hacia abajo</small>
                </article>
            </div>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>

</html>
